    status: approved
    grain: one row per generating unit per operating day
    entity_key: [unit_id]
    time_identity: date
    target: heat_rate
    approved_features:
      - avg_generation_mw
      - main_steam_temp_c
      - reheat_steam_temp_c
      - scr_temp_c
      - condenser_outlet_water_temp
      - coal_avg_heat_value_kcal_kg
    quality_policy:
      field: heat_rate_valid
      accepted_values: [true]
      minimum_valid_rows: 100
    split_policy:
      kind: chronological_holdout
      time_field: date
      test_fraction: 0.25
      preprocessing_fit_scope: training_only
      seed: 42
    evidence:
      - &workbook
        kind: source_workbook
        ref: data/2026年機組數據-20260729.xlsx#工作表-U1
        note: Physical headers and daily row layout observed in the source workbook.
