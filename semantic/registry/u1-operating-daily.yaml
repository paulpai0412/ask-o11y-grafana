        kind: generated_metadata
        ref: data-query-planner-mcp/metadata/csv-poc.json
        note: Reproducible CSV profile records types, units, validity rule, row counts, and date range.
      - &policy
        kind: policy_decision
        ref: docs/design/ontology-assisted-analysis.md
        note: This approval is limited to the retrospective U1 SHAP PoC and is not causal or enterprise domain approval.
