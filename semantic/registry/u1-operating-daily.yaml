        physical_name: date
        type: date
        unit: null
        semantic_kind: temporal
        analysis_role: time_identity
        status: approved
        availability: {visibility: known_at_record, source_time_field: date, eligible_at_as_of: true}
        evidence: [*workbook, *metadata, *policy]
