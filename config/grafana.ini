# Preserve the active settings from the grafana:13.1.2 image configuration.
[unified_alerting.prometheus_conversion]
rule_query_offset = 1m

[recording_rules]
enabled = true
timeout = 30s

# Grafana exposes only this plugin's setting as GF_PLUGIN_ASKO11Y_EFFECT_STORE.
# An empty plugin-ID list disables all-host forwarding (this is not a boolean).
[plugins]
forward_host_env_vars =

[plugin.consensys-asko11y-app]
asko11y_effect_store = $__env{GF_PATHS_DATA}/ask-o11y-operations
