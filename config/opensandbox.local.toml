# Local integration only. Production must use gVisor or Kata and API authentication.
[server]
host = "127.0.0.1"
port = 8080
max_sandbox_timeout_seconds = 120

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.0.21"

[storage]
allowed_host_paths = ["/var/empty/opensandbox"]
volume_default_size = "1Gi"

[store]
type = "sqlite"
path = ".scratch/opensandbox/state.db"

[docker]
network_mode = "bridge"
port_range_min = 40000
port_range_max = 40100
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
apparmor_profile = ""
pids_limit = 256
seccomp_profile = ""

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.4"
mode = "dns"

[renew_intent]
enabled = false
min_interval_seconds = 60
