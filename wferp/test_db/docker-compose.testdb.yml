services:
  mssql-test:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: wferp-mssql-test
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in wferp/test_db/.env}"
      MSSQL_COLLATION: "Chinese_Traditional_Stroke_Count_100_CI_AS"
      MSSQL_PID: "Developer"
    ports:
      - "14334:1433"
    volumes:
      - ./init:/init
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q ''SELECT 1'' || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
